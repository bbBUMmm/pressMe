<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8" />

<title>· · ·</title>
<meta name="theme-color" content="#05060A" />
<meta name="description" content="коротке кіно на тридцять секунд. краще зі звуком." />

<!-- прев'ю посилання (заміни URL на свій після деплою) -->
<meta property="og:type" content="website" />
<meta property="og:title" content="задайте секретний код (refrmdao) " />
<meta property="og:description" content="коротке кіно на тридцять секунд. краще зі звуком." />
<meta property="og:image" content="og.png" />
<meta name="twitter:card" content="summary_large_image" />

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2305060A'/%3E%3Ccircle cx='16' cy='16' r='3' fill='%23F5B7C6'/%3E%3C/svg%3E" />
<link rel="preload" href="fonts/inter-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/playfair-display-latin-wght-italic.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="stage">
    <canvas id="bg"></canvas>
    <canvas id="three"></canvas>
    <canvas id="fx"></canvas>

    <div id="grade"></div>
    <div id="vignette"></div>
    <div id="grain"></div>

    <!-- ВОРОТА -->
    <section id="gate">
      <div class="gate-inner">
        <p class="gate-label">задайте секретний код</p>
        <div class="field">
          <input id="code" type="text" autocomplete="off" autocorrect="off"
                 autocapitalize="off" spellcheck="false" inputmode="text"
                 enterkeyhint="go" aria-label="секретний код" />
          <span class="rule"></span>
        </div>
        <p class="gate-hint" id="hint"></p>
      </div>
      <button id="press" class="press" type="button" hidden>pressMe</button>
    </section>

    <!-- ШАРИ ПОКАЗУ -->
    <div id="words"></div>
    <div id="cuts"></div>

    <!-- ФІНАЛ -->
    <section id="final">
      <h1 class="q">What is your name?</h1>
      <p class="sub">(відповідь напиши у тіндер чаті :) I am waiting I guess)</p>
    </section>

    <button id="sound" class="ui-btn" type="button" aria-label="звук">♪</button>
    <button id="replay" class="ui-btn replay" type="button" hidden>ще раз</button>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
